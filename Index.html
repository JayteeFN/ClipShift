
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REVCLIP | Car Culture Lives Here</title>
  <style>
    body {
      margin: 0;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #19191f;
      padding: 24px;
      text-align: center;
    }
    h1 { color: #ff3434; }
    main { padding: 24px; max-width: 1000px; margin: auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: #22222b;
      padding: 16px;
      border-radius: 12px;
    }
    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>REVCLIP</h1>
    <p>Where Car Culture Lives.</p>
  </header>
  <main>
    <h2>Featured Car Videos</h2>
    <div class="grid">
      <div class="card">
        <h3>Exhaust Sounds</h3>
        <p>Discover custom exhaust setups.</p>
      </div>
      <div class="card">
        <h3>Turbo Sounds</h3>
        <p>Hear turbo spools and blow-off valves.</p>
      </div>
      <div class="card">
        <h3>Car Builds</h3>
        <p>Explore modified vehicles.</p>
      </div>
    </div>
  </main>
</body>
</html>
